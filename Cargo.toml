[package]
name = "massive"
version = "0.1.0"
edition = "2021"
authors = ["Johnathon Fox <johnathon.fox@gmail.com>"]
description = "Async Rust client for the Massive.com (formerly Polygon.io) REST and WebSocket API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/johnathonfox/massive-rs"
homepage = "https://github.com/johnathonfox/massive-rs"
documentation = "https://docs.rs/massive"
keywords = ["massive", "polygon", "finance", "stocks", "api"]
categories = ["api-bindings", "finance", "web-programming"]
rust-version = "1.75"

[dependencies]
reqwest = { version = "0.12", features = ["json", "gzip", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
thiserror = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"

[features]
default = ["reqwest/rustls-tls"]
